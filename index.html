<!DOCTYPE html>

<html>

<head>

    <title>AI Blog Title Generator</title>

      <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >



</head>

<body>

    <h1>AI Blog Title Generator</h1>

    <p>
        Generate creative and SEO-friendly blog titles instantly
    </p>


    <form method="POST">

        <label>
            Enter your blog topic
        </label>

        <br><br>

        <input
            type="text"
            name="topic"
            placeholder="Enter topic"
            value="{{ topic }}"
            required
        >

        <br><br>

        <button type="submit">
            ✨ Generate Titles
            
         </button>

    </form>


    {% if titles %}

        <hr>

        <h2>Generated Blog Titles</h2>

        {% for title in titles %}

            <p>
                <strong>{{ loop.index }}.</strong>
                {{ title }}
            </p>

        {% endfor %}

    {% endif %}


</body>

</html>
